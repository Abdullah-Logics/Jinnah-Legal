services:
  - type: web
    name: jinnah-signaling
    env: node
    region: ohio
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/standalone-signaling.js
    envVars:
      - key: CORS_ORIGIN
        value: https://ai-lawyer-blush.vercel.app
      - key: PORT
        value: "3002"

  - type: web
    name: jinnah-legal-api
    env: node
    region: ohio
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://ai-lawyer-blush.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
